# Render 배포 설정 — https://render.com
#
#   1. GitHub 저장소를 Render 에 연결하고 "New > Blueprint" 선택
#   2. 이 파일이 자동으로 읽힌다
#   3. 아래 sync:false 항목들은 Render 대시보드에서 직접 입력한다
#      (.env 는 git 에 안 올라가므로 값이 저장소에 없다)
#
# 배포 후 반드시 할 것 3가지 — 안 하면 로그인·지도가 안 된다
#   · Supabase  > Authentication > URL Configuration
#       Site URL 과 Redirect URLs 에 배포 주소 추가
#   · Kakao     > 내 애플리케이션 > 플랫폼 > Web > 사이트 도메인
#       배포 주소 추가 (안 하면 지도가 회색으로만 뜬다)
#   · 이 파일의 CORS_ORIGINS 를 배포 주소로 (아래 참고)

services:
  - type: web
    name: jeju-cagong
    runtime: python
    plan: free               # 무료 플랜은 15분 idle 후 잠든다. 첫 요청이 30초쯤 걸림
    region: singapore        # 제주에서 가장 가까운 리전

    buildCommand: pip install -r requirements.txt

    # $PORT 는 Render 가 주입한다. --host 0.0.0.0 이 없으면 외부에서 접속이 안 된다.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # --- 대시보드에서 직접 입력 (비밀값) ---
      - key: DATABASE_URL
        sync: false          # Supabase Session pooler URI
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: KAKAO_REST_KEY
        sync: false
      - key: KAKAO_JS_KEY
        sync: false

      # --- 저장소에 둬도 되는 값 ---
      - key: SUPABASE_URL
        value: https://ddcsuwxiwnqrhkjlacnx.supabase.co
      - key: SUPABASE_JWT_SECRET
        value: ""            # 비대칭키(ES256) 프로젝트라 비워둔다
      - key: AUTH_REQUIRED
        value: "true"        # ⚠️ 배포에서는 반드시 true
      - key: USE_KAKAO_NAVI
        value: "true"
      - key: WALK_DETOUR_FACTOR
        value: "1.3"
      - key: WALK_SPEED_KMH
        value: "4.0"

      # 프론트를 같은 서버가 서빙하므로 사실상 CORS 가 필요 없다.
      # 그래도 팀원이 로컬에서 배포 API 를 부를 수 있게 열어둔다.
      # (localhost 는 코드에서 정규식으로 이미 허용된다)
      - key: CORS_ORIGINS
        value: https://jeju-cagong.onrender.com
